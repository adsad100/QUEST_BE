spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quest_app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: quest_user
    password: YOUR_DB_PASSWORD_HERE
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8080
